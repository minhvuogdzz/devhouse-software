<!doctype html>
<html lang="vi" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Devhouse CMS — Administration</title>
    <link rel="icon" href="/favicon.ico?v=20261011" sizes="48x48" />
    <link rel="shortcut icon" href="/favicon.ico?v=20261011" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=20261011" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png?v=20261011" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=20261011" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png?v=20261011" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20261011" />
    <link rel="manifest" href="/site.webmanifest?v=20261011" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('dh-theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved || (systemDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>

    class="bg-bg text-fg min-h-screen antialiased selection:bg-primary-subtle selection:text-primary"
  >

  </body>
</html>
