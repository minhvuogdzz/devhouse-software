stages:
  - prepare
  - verify
  - test
  - build
  - package
  - scan
  - deploy:staging
  - deploy:production
  - post-deploy

variables:
  NODE_VERSION: '22'
  DOCKER_BUILDKIT: '1'

default:
  image: node:22-bookworm-slim
  interruptible: true

# ─────────────────────────────────────────────────────────────
# Stage 1: Prepare
# ─────────────────────────────────────────────────────────────
install:
  stage: prepare
  cache:
    key:
      files:
        - yarn.lock
    paths:
      - .yarn/cache
      - node_modules
      - apps/*/node_modules
      - packages/*/node_modules
  script:
    - corepack enable
    - yarn install --immutable

# ─────────────────────────────────────────────────────────────
# Stage 2: Verify
# ─────────────────────────────────────────────────────────────
lint:
  stage: verify
  needs: ['install']
  script:
    - corepack enable
    - yarn lint

format:check:
  stage: verify
  needs: ['install']
  script:
    - corepack enable
    - yarn format:check

# ─────────────────────────────────────────────────────────────
# Stage 3: Test
# ─────────────────────────────────────────────────────────────
test:
  stage: test
  needs: ['install']
  script:
    - corepack enable
    - yarn test

# ─────────────────────────────────────────────────────────────
# Stage 4: Build
# ─────────────────────────────────────────────────────────────
build:apps:
  stage: build
  needs: ['install']
  script:
    - corepack enable
    - yarn build

# ─────────────────────────────────────────────────────────────
# Stage 5: Package (Docker Container Builds)
# ─────────────────────────────────────────────────────────────
.docker-build:
  stage: package
  image: docker:27-cli
  services:
    - docker:27-dind
  before_script:
    - echo "$CI_JOB_TOKEN" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'

package:api:
  extends: .docker-build
  needs: ['test', 'build:apps']
  script:
    - docker build -f apps/api/Dockerfile -t "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE/api:main" .
    - docker push "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/api:main"

package:web:
  extends: .docker-build
  needs: ['test', 'build:apps']
  script:
    - docker build -f apps/web/Dockerfile -t "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE/web:main" .
    - docker push "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/web:main"

package:admin:
  extends: .docker-build
  needs: ['test', 'build:apps']
  script:
    - docker build -f apps/admin/Dockerfile -t "$CI_REGISTRY_IMAGE/admin:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE/admin:main" .
    - docker push "$CI_REGISTRY_IMAGE/admin:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/admin:main"

package:edge:
  extends: .docker-build
  needs: ['test', 'build:apps']
  script:
    - docker build -f infra/nginx/Dockerfile -t "$CI_REGISTRY_IMAGE/edge:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE/edge:main" .
    - docker push "$CI_REGISTRY_IMAGE/edge:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/edge:main"

# ─────────────────────────────────────────────────────────────
# Stage 6: Scan
# ─────────────────────────────────────────────────────────────
security:scan:
  stage: scan
  image: aquasec/trivy:latest
  needs: ['package:api']
  allow_failure: true
  script:
    - trivy image --severity HIGH,CRITICAL "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'

# ─────────────────────────────────────────────────────────────
# Stage 7: Deploy Staging
# ─────────────────────────────────────────────────────────────
deploy:staging:
  stage: deploy:staging
  image: alpine:latest
  needs: ['package:api', 'package:web', 'package:admin', 'package:edge']
  environment:
    name: staging
    url: https://staging.devhouse.example
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add - > /dev/null || true
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  script:
    - echo "Deploying commit $CI_COMMIT_SHORT_SHA to Staging VPS..."
    - ssh "$STAGING_SSH_USER@$STAGING_HOST" "/opt/devhouse/deploy.sh $CI_COMMIT_SHORT_SHA"

# ─────────────────────────────────────────────────────────────
# Stage 8: Deploy Production
# ─────────────────────────────────────────────────────────────
deploy:production:
  stage: deploy:production
  image: alpine:latest
  needs: ['package:api', 'package:web', 'package:admin', 'package:edge']
  environment:
    name: production
    url: https://www.devhouse.example
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'
      when: manual
  resource_group: production-deploy
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$PROD_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add - > /dev/null || true
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  script:
    - echo "Deploying release $CI_COMMIT_TAG (commit $CI_COMMIT_SHORT_SHA) to Production VPS..."
    - ssh "$PROD_SSH_USER@$PROD_HOST" "/opt/devhouse/deploy.sh $CI_COMMIT_SHORT_SHA"

# ─────────────────────────────────────────────────────────────
# Stage 9: Post-Deploy Verification
# ─────────────────────────────────────────────────────────────
post-deploy:health-gate:
  stage: post-deploy
  image: alpine/curl:latest
  needs: ['deploy:production']
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'
  script:
    - curl -f -s -o /dev/null "https://www.devhouse.example/api/v1/health/live"
