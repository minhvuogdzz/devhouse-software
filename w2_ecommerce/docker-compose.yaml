version: '3.3'

services:
  app:
    build: .
    ports:
      - "5000:5000"
    restart: always
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: uet_store
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: