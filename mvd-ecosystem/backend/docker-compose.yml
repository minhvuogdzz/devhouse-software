name: photo-picker-backend

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: photo-picker-backend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
