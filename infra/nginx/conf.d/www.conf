server {
    listen 443 ssl;
    http2 on;
    server_name www.devhouse.example;

    include /etc/nginx/snippets/ssl.conf;
    include /etc/nginx/snippets/security-headers.conf;

    ssl_certificate /etc/nginx/certs/live/devhouse.example/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/devhouse.example/privkey.pem;

    # Admin surface is not routable from the public domain (§33.2)
    location ^~ /api/v1/admin/ {
        return 404;
    }
    location ^~ /api/v1/auth/ {
        return 404;
    }

    # Public contact form submission: strict rate limit, no cache
    location = /api/v1/contact {
        limit_req zone=contact burst=3 nodelay;
        client_max_body_size 32m;

        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://api:4000;
    }

    # General public API endpoints: micro-cache + rate limit
    location /api/v1/ {
        limit_req zone=general_api burst=40 nodelay;

        proxy_cache api_cache;
        proxy_cache_valid 200 60s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;

        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://api:4000;
    }

    # Hashed static client assets (cache immutable)
    location /assets/ {
        include /etc/nginx/snippets/proxy-params.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        proxy_pass http://web:3000;
    }

    # SSR Website and static pages
    location / {
        proxy_cache html_cache;
        proxy_cache_valid 200 301 60s;
        proxy_cache_valid 404 30s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;

        # Bypass cache if session cookie is present
        proxy_cache_bypass $cookie___Host_dh_sid;
        proxy_no_cache $cookie___Host_dh_sid;

        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://web:3000;
    }
}
