# Default server: drop requests with unknown Host header (§33.2)
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/certs/dummy.crt;
    ssl_certificate_key /etc/nginx/certs/dummy.key;

    # Allow ACME webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 444;
    }
}

# Redirect apex domain and raw HTTP to www HTTPS
server {
    listen 80;
    server_name devhouse.example www.devhouse.example admin.devhouse.example;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name devhouse.example;

    include /etc/nginx/snippets/ssl.conf;
    ssl_certificate /etc/nginx/certs/live/devhouse.example/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/devhouse.example/privkey.pem;

    location / {
        return 301 https://www.devhouse.example$request_uri;
    }
}
