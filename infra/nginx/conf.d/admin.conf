server {
    listen 443 ssl;
    http2 on;
    server_name admin.devhouse.example;

    include /etc/nginx/snippets/ssl.conf;
    include /etc/nginx/snippets/security-headers.conf;

    ssl_certificate /etc/nginx/certs/live/devhouse.example/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/devhouse.example/privkey.pem;

    # Admin host is fully noindex
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Authentication endpoints: strictest rate limit and zero caching
    location ^~ /api/v1/auth/ {
        limit_req zone=auth burst=5 nodelay;

        include /etc/nginx/snippets/proxy-params.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        proxy_pass http://api:4000;
    }

    # Administrative API endpoints: never cached
    location ^~ /api/v1/ {
        limit_req zone=general_api burst=40 nodelay;

        include /etc/nginx/snippets/proxy-params.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        proxy_pass http://api:4000;
    }

    # Admin SPA static app container
    location / {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://admin:80;
    }
}
