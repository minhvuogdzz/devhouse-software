name: mvd-ecosystem

services:
  # ========================================================
  # 1. NestJS Backend API (Auth, License, Config, Sync)
  # ========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mvd-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    networks:
      - mvd-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/config/public || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ========================================================
  # 2. Admin Management Dashboard (Next.js Static + Nginx)
  # ========================================================
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.yourdomain.com}
    container_name: mvd-admin
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-3001}:80"
    depends_on:
      - backend
    networks:
      - mvd-network

  # ========================================================
  # 3. Official Web Showcase (React + Vite + Nginx)
  # ========================================================
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.yourdomain.com}
    container_name: mvd-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - mvd-network

  # ========================================================
  # 4. Optional: Self-Hosted MongoDB (Profile: local-db)
  # Run: docker compose --profile local-db up -d
  # If using MongoDB Atlas Cloud, this container stays off.
  # ========================================================
  mongo:
    image: mongo:7.0
    container_name: mvd-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - mvd-network
    profiles:
      - local-db

networks:
  mvd-network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
